method: searched
source: npm registry search, PyPI, Packagist, GitHub (BackMarket org), api.backmarket.dev docs
description: >-
  Package-registry surface for Back Market. Back Market publishes NO first-party client SDK
  for its seller API in any language — the API Guidelines at api.backmarket.dev document raw
  HTTP only, and no SDK/library links appear in the docs. The one clearly first-party API
  package on a public registry is the Spectral ruleset Back Market uses to govern its own API
  designs (@backmarket-api/rulesets, published from github.com/BackMarket/api-rulesets and
  already harvested into rules/ in this repo). Community-maintained wrappers exist but are
  not endorsed by Back Market.
packages:
- language: javascript
  registry: npm
  name: "@backmarket-api/rulesets"
  url: https://www.npmjs.com/package/@backmarket-api/rulesets
  install: npm install @backmarket-api/rulesets
  version: 1.7.0
  published: '2024-03-22'
  license: MIT
  repository: https://github.com/BackMarket/api-rulesets
  official: true
  kind: governance-ruleset
  description: >-
    Back Market's own Spectral ruleset for API design governance. Not a client library —
    it is the linting contract Back Market applies to its OpenAPI definitions. Harvested
    into rules/back-market-rules.yml + rules/functions/ in this repo.
