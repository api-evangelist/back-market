notes: >-
  The npm scope @backmarket/* holds a set of Vue UI micro-components (button, carousel,
  modal, sticky, ...) last published in 2018 by a Back Market front-end engineer. They are
  storefront design-system experiments, not API client libraries, and are not documented or
  supported as part of the seller API — recorded here for completeness, not counted as SDKs.
  Because no official client SDK exists, no `SDKs` pointer is wired in apis.yml.
  The github.com/BackMarket organization exists (HTTP 200) but exposes zero public
  repositories — github.com/BackMarket/api-rulesets, referenced by the npm package
  metadata, is not publicly readable. Two Postman teams whose handles contain
  "backmarket" answer 200 (postman.com/backmarket-mobile,
  postman.com/backmarket-jira-782969) but neither could be verified as Back Market-operated
  or as carrying a seller-API collection, so no `Postman` pointer is wired.
