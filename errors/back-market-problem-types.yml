description: >-
  Error catalog derived from every 4xx/5xx response declared in the Back Market seller
  OpenAPI, grouped by status + envelope + description. Back Market ships four co-existing
  error envelopes (ErrorResponseV1/V2/V3 and an RFC 7807-flavored Problem), all served as
  application/json rather than application/problem+json, with a `type` that is deliberately
  a readable path (e.g. /errors/authorization-failed) instead of a URI. Many operations
  declare a status with a human description but no response schema at all — those are
  recorded here with `schema: null` so the gap stays visible.
envelopes:
- name: ErrorResponseV1
  shape: '{ error: { code, message, data, docLink, target }, requestId }'
- name: ErrorResponseV2
  shape: '{ errors: [ { code, message, data, docLink, target } ], requestId }'
- name: ErrorResponseV3
  shape: '{ error: {...}, status, title, type, requestId }'
- name: ValidationErrorResponseV3
  shape: 'ErrorResponseV3 plus errors: [ { type, title, detail, target, context } ]'
- name: Problem / ProblemValidation
  shape: 'RFC 7807 members (type, title, status, detail, instance) plus errors[]'
  deviation: 'type is a readable [a-z-/]* path, not a URI; media type is application/json'
- name: OrderIdValidationError
  shape: '{ error: { code, message }, data: { fields: {...} } }'
