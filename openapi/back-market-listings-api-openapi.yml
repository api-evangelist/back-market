                        shipper_display:
                          type: string
                          description: The company that manages the delivery.
                          example: UPS
                        country_code:
                          type: string
                          description: 'The market where this shipping option is available. Passed as the

                            language code of this market.

                            '
                          example: it-it
                  state:
                    $ref: '#/components/schemas/ListingStateValue'
                  grade:
                    $ref: '#/components/schemas/AestheticGradeValue'
                  quantity:
