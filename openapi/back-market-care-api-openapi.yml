          example: 0
        username:
          type: string
          description: Username of the customer (always returns empty)
          deprecated: true
          example: ''
        first_name:
          type: string
          description: First name of the customer
          example: John
        last_name:
          type: string
          description: Last name of the customer
          example: Doe
        email:
          type: string
          description: Email of the customer
          example: john.doe@mymail.com
