        first_name:
          type: string
          description: First name of the Seller
          example: Rose
        last_name:
          type: string
          description: Last name of the Seller
          example: Bush
    product:
      type: object
      properties:
        product_id:
          type: integer
          description: ID of the product
          example: 123
        category_3:
          $ref: '#/components/schemas/category_3'
    client:
      type: object
      properties:
        id:
          type: integer
          description: ID of the customer (always returns a static value of 0)
