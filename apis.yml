aid: back-market
name: Back Market
description: 'Back Market is a French-founded global online marketplace dedicated exclusively
  to refurbished consumer electronics — smartphones, laptops, tablets, consoles, watches,
  audio and home appliances — operating across 17 countries on three regional platforms
  (EU via backmarket.fr, North America via backmarket.com, Asia-Pacific via backmarket.co.jp).
  For the ~1,800 professional refurbishers selling on the platform, Back Market publishes a
  seller-facing REST API (the "Back Market API Guidelines") covering the marketplace taxonomy,
  product and listing management, order and orderline workflows, BuyBack (trade-in) orders and
  listings, Backship deliveries and returns, the Care after-sales platform (claims, messages,
  refunds, item transfers), and Backbox competitive pricing data. The API is documented as an
  OpenAPI 3.0.3 contract rendered with Stoplight Elements at api.backmarket.dev, authenticated
  with a Basic token issued from the seller Back Office, and mirrored by preprod environments
  on every regional platform.'
