apis:
- name: Back Market API
  description: 'The Back Market seller (partner) API — a REST API over JSON that lets
    professional refurbishers manage their presence on the Back Market marketplace: browse the
    marketplace category tree, create and update products and listings, list and update orders
    and orderlines, upload customer invoices, run the BuyBack trade-in flow (orders, messages,
    suspensions, validations, counter-offers, listings), read Backship deliveries and returns,
    operate the Care after-sales platform (care folders, problems, messages, refunds, item
    transfers), and pull Backbox competitive pricing data. Requests are authenticated with a
    Basic token generated in the seller Back Office and require a descriptive User-Agent and an
    Accept-Language country code.'
