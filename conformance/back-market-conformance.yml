compliance_program:
  published: false
  note: >-
    Back Market publishes a corporate impact report and an RFC 9116 security.txt, but no
    trust center and no named security certifications (SOC 2 / ISO 27001 / PCI DSS) were
    found on any host. Probed trust.backmarket.com, security.backmarket.com,
    backmarket.com/security, backmarket.com/trust, backmarket.com/compliance - all miss.
